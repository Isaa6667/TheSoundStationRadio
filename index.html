<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Sound Station — Online Radio Player | Icecast, Shoutcast, Zeno.FM</title>

    <meta name="description" content="The Sound Station HTML5 player: now playing with album cover, lyrics, history, YouTube clip, and installable app (PWA). Compatible with Icecast, Shoutcast, Zeno.FM, and Azuracast — no API key required.">
    <meta name="keywords" content="the sound station, radio player, online radio, html5 radio player, web radio, icecast, shoutcast, zeno fm, azuracast, radio streaming, now playing, pwa">

    <link rel="canonical" href="https://jailsonsb2.github.io/RadioPlayer/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="The Sound Station — Online Radio Player">
    <meta property="og:description" content="The Sound Station HTML5 player: now playing with cover, lyrics, history, YouTube clip, and PWA.">
    <meta property="og:url" content="https://jailsonsb2.github.io/RadioPlayer/">
    <meta property="og:image" content="https://jailsonsb2.github.io/RadioPlayer/img/cover.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0b0e13">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "The Sound Station Player",
        "url": "https://jailsonsb2.github.io/RadioPlayer/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0" },
        "description": "The Sound Station HTML5 radio player: now playing with album cover, lyrics, history, YouTube clip, and PWA.",
        "author": { "@type": "Person", "name": "Jailson Bezerra", "url": "https://github.com/jailsonsb2" }
    }
    </script>

    <link rel="icon" type="image/png" href="img/cover.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div class="bg" aria-hidden="true">
        <div id="bgCover"></div>
        <div class="bg-overlay"></div>
    </div>

    <button type="button" id="installPwaBtn" class="install-btn" hidden>
        <i class="fa fa-download"></i> Install App
    </button>

    <main class="app">
        <header class="masthead">
            <span id="radioName">THE SOUND STATION</span>
        </header>

        <section class="player">
            <div class="artwork cover-album">
                <div id="currentCoverArt"></div>
            </div>

            <div class="player-info">
                <span class="live-badge"><span class="live-dot"></span> LIVE NOW</span>
                <h1 id="currentSong" class="text-uppercase">Song Title</h1>
                <h2 id="currentArtist" class="text-capitalize">Artist Name</h2>

                <div class="controls">
                    <div class="control-cluster">

                        <div class="volume-wrap volume-control">
                            <button type="button" class="ctrl-btn volume-toggle" aria-label="Volume" title="Volume">
                                <i class="fa fa-volume-up"></i>
                            </button>
                            <div class="volume-popover" hidden>
                                <input type="range" id="volume" step="1" min="0" max="100" value="80" aria-label="Volume">
                                <span class="vol-value"><span id="volIndicator">80</span>%</span>
                            </div>
                        </div>

                        <button type="button" class="play-btn" onclick="togglePlay()" aria-label="Play or pause">
                            <i id="playerButton" class="fa fa-play"></i>
                        </button>

                        <button type="button" class="ctrl-btn lyrics" title="Song Lyrics" aria-label="Song Lyrics">
                            <i class="fa fa-music"></i>
                        </button>

                        <button type="button" class="ctrl-btn clip-toggle" title="Music Video" aria-label="Music Video" hidden>
                            <i class="fa fa-youtube-play"></i>
                        </button>
                    </div>

                    <span id="buttonPlay" class="sr-only" aria-live="polite">PLAY</span>
                </div>
            </div>
        </section>

        <section class="historic">
            <h2 class="section-title">Recently Played</h2>
            <div class="history-list" id="historicSong">
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Song Title</div>
                        <div class="artist">Artist Name</div>
                    </div>
                </article>
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Song Title</div>
                        <div class="artist">Artist Name</div>
                    </div>
                </article>
            </div>
        </section>

        <footer class="partner">
            <a href="https://volticast.com/r/sound-station" target="_blank" rel="noopener">
                <img src="img/radiosnet.png" alt="Listen on RadiosNet — download the app" width="234" height="60">
            </a>
        </footer>
    </main>

    <div id="modalLyrics" role="dialog" aria-modal="true" aria-labelledby="lyricsSong" aria-hidden="true">
        <div class="modal-card">
            <header>
                <h3 id="lyricsSong">Lyrics</h3>
                <button type="button" class="modal-close" aria-label="Close">
                    <i class="fa fa-times"></i>
                </button>
            </header>
            <div id="lyric"></div>
        </div>
    </div>

    <script type="text/javascript" src="config.js"></script>
    <script type="text/javascript" src="js/script.js"></script>

    <script>
        // Lyrics modal
        (function () {
            var modal = document.getElementById('modalLyrics');
            var openButton = document.querySelector('.lyrics');

            function closeModal() {
                modal.style.display = 'none';
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
            }

            openButton.addEventListener('click', function (event) {
                event.preventDefault();
                if (!openButton.hasAttribute('data-toggle')) return;
                modal.style.display = 'flex';
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
            });

            modal.addEventListener('click', function (event) {
                if (event.target === modal) closeModal();
            });
            modal.querySelector('.modal-close').addEventListener('click', closeModal);
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') closeModal();
            });
        })();

        // Volume popover
        (function () {
            var wrap = document.querySelector('.volume-wrap');
            var toggle = document.querySelector('.volume-toggle');
            var popover = document.querySelector('.volume-popover');
            if (!wrap || !toggle || !popover) return;

            toggle.addEventListener('click', function () {
                popover.hidden = !popover.hidden;
            });
            document.addEventListener('click', function (event) {
                if (!wrap.contains(event.target)) popover.hidden = true;
            });
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>

</body>
</html>
