<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>The Sound Station | Listen Live</title>

    <meta name="description" content="Listen live to The Sound Station. Enjoy great music, live presenters, and entertainment 24 hours a day.">
    <meta name="keywords" content="The Sound Station, listen live, online radio, live radio, music, radio station">

    <link rel="canonical" href="#">

    <meta property="og:type" content="website">
    <meta property="og:title" content="The Sound Station | Listen Live">
    <meta property="og:description" content="Listen live to The Sound Station with our official online player.">
    <meta property="og:url" content="#">
    <meta property="og:image" content="img/cover.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0b0e13">

    <link rel="icon" type="image/png" href="img/cover.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div class="bg" aria-hidden="true">
        <div id="bgCover"></div>
        <div class="bg-overlay"></div>
    </div>

    <button type="button" id="installPwaBtn" class="install-btn" hidden>
        <i class="fa fa-download"></i> Install App
    </button>

    <main class="app">
        <header class="masthead">
            <span id="radioName">THE SOUND STATION</span>
        </header>

        <section class="player">
            <div class="artwork cover-album">
                <div id="currentCoverArt"></div>
            </div>

            <div class="player-info">
                <span class="live-badge"><span class="live-dot"></span> LIVE NOW</span>
                <h1 id="currentSong" class="text-uppercase">Song Title</h1>
                <h2 id="currentArtist" class="text-capitalize">Artist Name</h2>

                <div class="controls">
                    <div class="control-cluster">

                       <div class="control-cluster">

    <div class="volume-wrap volume-control">
        <button type="button" class="ctrl-btn volume-toggle" aria-label="Volume" title="Volume">
            <i class="fa fa-volume-up"></i>
        </button>

        <div class="volume-popover" hidden>
            <input type="range" id="volume" step="1" min="0" max="100" value="80" aria-label="Volume">
            <span class="vol-value">
                <span id="volIndicator">80</span>%
            </span>
        </div>
    </div>

    <button type="button" class="play-btn" onclick="togglePlay()" aria-label="Play or pause">
        <i id="playerButton" class="fa fa-play"></i>
    </button>

    <button type="button" class="ctrl-btn lyrics" title="Song Lyrics" aria-label="Song Lyrics">
        <i class="fa fa-music"></i>
    </button>

    <button type="button" class="ctrl-btn popout-btn" title="Pop Out Player" aria-label="Pop Out Player">
        <i class="fa fa-external-link"></i>
    </button>

    <button type="button" class="ctrl-btn clip-toggle" title="Music Video" aria-label="Music Video" hidden>
        <i class="fa fa-youtube-play"></i>
    </button>
                           
    <button type="button" class="ctrl-btn discord-btn" title="Join our Discord" aria-label="Join our Discord">
    <i class="fa fa-discord"></i>
    </button>

</div>

                    <span id="buttonPlay" class="sr-only" aria-live="polite">PLAY</span>
                </div>
            </div>
        </section>

        <section class="historic">
            <h2 class="section-title">Recently Played</h2>
            <div class="history-list" id="historicSong">
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Song Title</div>
                        <div class="artist">Artist Name</div>
                    </div>
                </article>
                <article>
                    <div class="cover-historic"></div>
                    <div class="music-info">
                        <div class="song">Song Title</div>
                        <div class="artist">Artist Name</div>
                    </div>
                </article>
            </div>
        </section>

        <!-- Footer removed -->
    </main>

    <div id="modalLyrics" role="dialog" aria-modal="true" aria-labelledby="lyricsSong" aria-hidden="true">
        <div class="modal-card">
            <header>
                <h3 id="lyricsSong">Lyrics</h3>
                <button type="button" class="modal-close" aria-label="Close">
                    <i class="fa fa-times"></i>
                </button>
            </header>
            <div id="lyric"></div>
        </div>
    </div>

    <script type="text/javascript" src="config.js"></script>
    <script type="text/javascript" src="js/script.js"></script>

</body>
</html>
