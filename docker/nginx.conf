server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O nome da rádio pode ter acento e vai parar no config.js/manifest.json.
    # Sem o charset declarado o browser precisa adivinhar a codificação.
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json
                  application/manifest+json image/svg+xml;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Arquivos gerados a partir das variáveis de ambiente: se o browser cachear,
    # trocar a env var não surte efeito. Nunca cachear.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-store" always;
    }

    # O service worker precisa ser revalidado sempre, senão uma versão antiga
    # continua servindo o app do cache dela para sempre.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Imagens e fontes praticamente não mudam.
    # Só o `expires` — somado a um add_header Cache-Control o header sai
    # duplicado na resposta.
    location ~* \.(png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
    }

    # CSS e JS mudam a cada atualização da imagem — cache curto para que um
    # `docker pull` novo apareça rápido.
    location ~* \.(css|js)$ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
